name: "Secrets scan"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
