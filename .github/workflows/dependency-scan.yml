name: "Dependency Scan"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency scan (govulncheck + Nancy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Download all dependencies first so govulncheck and Nancy
      # can resolve imports — without this both tools fail with
      # "missing go.sum entry" errors
      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: govulncheck - Go stdlib and module vulnerabilities
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Nancy - OSS Index dependency audit
        working-directory: backend
        run: |
          go install github.com/sonatypeoss/nancy@latest
          go list -json -deps ./... | nancy sleuth
