name: "Dependency Scan"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency scan (govulncheck + Nancy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # go mod tidy downloads all deps AND regenerates go.sum
      # govulncheck and Nancy both need go.sum to be complete
      - name: Tidy Go modules
        working-directory: backend
        run: go mod tidy

      - name: govulncheck - Go stdlib and module vulnerabilities
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Nancy - OSS Index dependency audit
        working-directory: backend
        run: |
          go install github.com/sonatype-nexus-community/nancy@latest
          go list -json -deps ./... | nancy sleuth
