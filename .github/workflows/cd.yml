name: "CD - Docker Deploy"
 
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
 
permissions:
  contents: read
 
jobs:
  docker-deploy:
    name: Deploy via Docker Compose on EC2
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
 
    steps:
      # ── 1. Checkout — needed to scp docker-compose.yml to EC2 ────────────
      - name: Checkout code
        uses: actions/checkout@v4
 
      # ── 2. Copy docker-compose.yml to EC2 ────────────────────────────────
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "docker-compose.yml"
          target:   "~/skillpulse"
 
      # ── 3. SSH into EC2 — pull exact SHA images and deploy ────────────────
      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG:            ${{ github.event.workflow_run.head_sha }}
          DOCKERHUB_USERNAME:   ${{ secrets.DOCKERHUB_USERNAME }}
          MYSQL_ROOT_PASSWORD:  ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_NAME:              ${{ secrets.MYSQL_DATABASE }}
          DB_USER:              ${{ secrets.MYSQL_USER }}
          DB_PASSWORD:          ${{ secrets.MYSQL_PASSWORD }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     IMAGE_TAG,DOCKERHUB_USERNAME,MYSQL_ROOT_PASSWORD,DB_NAME,DB_USER,DB_PASSWORD
          command_timeout: 12m
          script: |
            set -euo pipefail
 
            APP_DIR=~/skillpulse
            cd "$APP_DIR"
 
            echo "=== Image tag: ${IMAGE_TAG} ==="
 
            # ── 1. Write .env from GitHub Secrets ────────────────────────────
            # Never stored in git — written fresh on every deploy
            cat > .env <<EOF
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
            MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            DB_HOST=db
            DB_PORT=3306
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            DB_NAME=${DB_NAME}
            EOF
 
            # ── 2. Pin compose to exact SHA built and scanned by CI ──────────
            export BACKEND_IMAGE="${DOCKERHUB_USERNAME}/skillpulse-backend:${IMAGE_TAG}"
            export FRONTEND_IMAGE="${DOCKERHUB_USERNAME}/skillpulse-frontend:${IMAGE_TAG}"
 
            # Override image tags in compose without editing the file
            export COMPOSE_BACKEND_IMAGE="$BACKEND_IMAGE"
            export COMPOSE_FRONTEND_IMAGE="$FRONTEND_IMAGE"
 
            # ── 3. Pull exact images ─────────────────────────────────────────
            echo "Pulling images..."
            docker pull "$BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"
 
            # Tag as :latest so docker-compose.yml image refs resolve correctly
            docker tag "$BACKEND_IMAGE"  "${DOCKERHUB_USERNAME}/skillpulse-backend:latest"
            docker tag "$FRONTEND_IMAGE" "${DOCKERHUB_USERNAME}/skillpulse-frontend:latest"
 
            # ── 4. Save old container IDs for rollback ───────────────────────
            PREV_BACKEND=$(docker ps -q  --filter "name=skillpulse-backend"  2>/dev/null || true)
            PREV_FRONTEND=$(docker ps -q --filter "name=skillpulse-frontend" 2>/dev/null || true)
 
            # ── 5. Bring up new containers ───────────────────────────────────
            echo "Starting containers..."
            docker compose up -d --remove-orphans
 
            # ── 6. Smoke test — frontend on port 80 ──────────────────────────
            echo "=== Smoke test: frontend ==="
            for i in $(seq 1 6); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || true)
              if [ "$STATUS" = "200" ]; then
                echo "Frontend passed (attempt $i) — HTTP $STATUS"
                break
              fi
              echo "Attempt $i: HTTP $STATUS — retrying in 5s..."
              sleep 5
              if [ "$i" = "6" ]; then
                echo "FRONTEND SMOKE TEST FAILED — rolling back"
                docker compose down --remove-orphans
                [ -n "$PREV_BACKEND"  ] && docker start "$PREV_BACKEND"  || true
                [ -n "$PREV_FRONTEND" ] && docker start "$PREV_FRONTEND" || true
                exit 1
              fi
            done
 
            # ── 7. Smoke test — backend /health on port 8080 ─────────────────
            echo "=== Smoke test: backend /health ==="
            for i in $(seq 1 6); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "Backend passed (attempt $i) — HTTP $STATUS"
                break
              fi
              echo "Attempt $i: HTTP $STATUS — retrying in 5s..."
              sleep 5
              if [ "$i" = "6" ]; then
                echo "BACKEND SMOKE TEST FAILED — rolling back"
                docker compose down --remove-orphans
                [ -n "$PREV_BACKEND"  ] && docker start "$PREV_BACKEND"  || true
                [ -n "$PREV_FRONTEND" ] && docker start "$PREV_FRONTEND" || true
                exit 1
              fi
            done
 
            # ── 8. Clean up dangling images ──────────────────────────────────
            docker image prune -f
 
            echo "=== Docker deploy complete — ${IMAGE_TAG} ==="
