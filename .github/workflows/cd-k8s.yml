name: "CD - kind Cluster Deploy"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  issues: write       # needed to create GitHub issue on failure

jobs:

  # ── Staging gate ─────────────────────────────────────────────────────────────
  # Deploys to a separate namespace (skillpulse-staging) first.
  # GitHub environment "staging" can have its own protection rules and secrets.
  # Production job below only runs after this passes.
  deploy-staging:
    name: Deploy to staging namespace
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging        # maps to GitHub Environment "staging"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy k8s manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "k8s/"
          target:   "~/skillpulse-staging"

      - name: Deploy to staging namespace
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG:           ${{ github.event.workflow_run.head_sha }}
          DOCKER_USER:         ${{ secrets.DOCKERHUB_USERNAME }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE:      ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER:          ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD:      ${{ secrets.MYSQL_PASSWORD }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     IMAGE_TAG,DOCKER_USER,MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD
          command_timeout: 15m
          script: |
            set -euo pipefail

            CLUSTER=skillpulse
            NAMESPACE=skillpulse-staging
            K8S_DIR=~/skillpulse-staging/k8s
            IMAGE_TAG="${IMAGE_TAG::7}"

            echo "=== Staging deploy: ${IMAGE_TAG} ==="

            # Ensure cluster exists (created by a prior production deploy or manually)
            if ! kind get clusters 2>/dev/null | grep -q "^${CLUSTER}$"; then
              echo "ERROR: kind cluster '${CLUSTER}' not found. Run a production deploy first."
              exit 1
            fi

            # Create staging namespace if it doesn't exist
            kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

            # Inject DB secret into staging namespace
            kubectl create secret generic skillpulse-db \
              --namespace="$NAMESPACE" \
              --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
              --from-literal=MYSQL_DATABASE="$MYSQL_DATABASE" \
              --from-literal=MYSQL_USER="$MYSQL_USER" \
              --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              --save-config \
              --dry-run=client -o yaml | kubectl apply -f -

            # Pin images to exact SHA
            sed -i \
              "s|image: .*/skillpulse-backend:.*|image: ${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}|" \
              "${K8S_DIR}/20-backend.yaml"
            sed -i \
              "s|image: .*/skillpulse-frontend:.*|image: ${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}|" \
              "${K8S_DIR}/30-frontend.yaml"

            # Apply core manifests into staging namespace (override namespace inline)
            kubectl apply -f "${K8S_DIR}/10-mysql.yaml"   --namespace="$NAMESPACE"
            kubectl apply -f "${K8S_DIR}/20-backend.yaml" --namespace="$NAMESPACE"
            kubectl apply -f "${K8S_DIR}/30-frontend.yaml" --namespace="$NAMESPACE"

            # Wait for rollouts
            kubectl rollout status statefulset/mysql   -n "$NAMESPACE" --timeout=180s
            kubectl rollout status deployment/backend  -n "$NAMESPACE" --timeout=120s
            kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=60s

            # Quick smoke test on staging backend
            kubectl port-forward svc/backend 8081:8080 -n "$NAMESPACE" &
            PF_PID=$!
            sleep 3
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/health || true)
            kill "$PF_PID" 2>/dev/null || true

            if [ "$STATUS" != "200" ]; then
              echo "STAGING smoke test FAILED — HTTP $STATUS"
              kubectl get pods -n "$NAMESPACE" -o wide
              exit 1
            fi

            echo "=== Staging smoke test PASSED — HTTP $STATUS ==="
            echo "=== Staging deploy complete: ${IMAGE_TAG} ==="

  # ── Production deploy ─────────────────────────────────────────────────────────
  # Only runs after staging passes.
  # GitHub environment "production" should have required reviewers configured:
  #   Settings → Environments → production → Required reviewers
  kind-deploy:
    name: Deploy to production (kind cluster on EC2)
    needs: deploy-staging     # staging must pass before production runs
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production   # triggers manual approval gate if reviewers are set

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy k8s manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "k8s/"
          target:   "~/skillpulse"

      - name: Deploy to kind cluster
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG:           ${{ github.event.workflow_run.head_sha }}
          DOCKER_USER:         ${{ secrets.DOCKERHUB_USERNAME }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE:      ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER:          ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD:      ${{ secrets.MYSQL_PASSWORD }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     IMAGE_TAG,DOCKER_USER,MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD
          command_timeout: 25m
          script: |
            set -euo pipefail

            CLUSTER=skillpulse
            NAMESPACE=skillpulse
            K8S_DIR=~/skillpulse/k8s

            # Slice to 7 chars to match short SHA used in CI build & push
            IMAGE_TAG="${IMAGE_TAG::7}"
            echo "=== Image tag: ${IMAGE_TAG} ==="

            # ── 1. Create or reuse cluster ────────────────────────────────────
            if kind get clusters 2>/dev/null | grep -q "^${CLUSTER}$"; then
              echo "Cluster '${CLUSTER}' already exists — reusing (rolling update)"
            else
              echo "Creating kind cluster..."
              kind create cluster \
                --config "${K8S_DIR}/kind-config.yaml" \
                --name "$CLUSTER" \
                --wait 60s

              # Install metrics-server (required for HPA)
              echo "Installing metrics-server..."
              kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
              # Patch metrics-server to skip TLS verification in kind (no real certs)
              kubectl patch deployment metrics-server \
                -n kube-system \
                --type=json \
                -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
              kubectl rollout status deployment/metrics-server -n kube-system --timeout=60s
            fi
            kubectl get nodes

            # ── 2. Pull and load images in parallel ───────────────────────────
            echo "Pulling images..."
            docker pull "${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}" &
            docker pull "${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}" &
            wait

            echo "Loading images into kind nodes..."
            kind load docker-image "${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}"  --name "$CLUSTER" &
            kind load docker-image "${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}" --name "$CLUSTER" &
            wait

            # ── 3. Pin manifests to exact SHA ─────────────────────────────────
            sed -i \
              "s|image: .*/skillpulse-backend:.*|image: ${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}|" \
              "${K8S_DIR}/20-backend.yaml"
            sed -i \
              "s|image: .*/skillpulse-frontend:.*|image: ${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}|" \
              "${K8S_DIR}/30-frontend.yaml"

            # ── 4. Save current revision for rollback ─────────────────────────
            PREV_BACKEND_REV=$(kubectl rollout history deployment/backend  -n "$NAMESPACE" --no-headers 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
            PREV_FRONTEND_REV=$(kubectl rollout history deployment/frontend -n "$NAMESPACE" --no-headers 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")

            # ── 5. Apply namespace + secret + manifests ───────────────────────
            kubectl apply -f "${K8S_DIR}/00-namespace.yaml"

            kubectl create secret generic skillpulse-db \
              --namespace="$NAMESPACE" \
              --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
              --from-literal=MYSQL_DATABASE="$MYSQL_DATABASE" \
              --from-literal=MYSQL_USER="$MYSQL_USER" \
              --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              --save-config \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply \
              -f "${K8S_DIR}/10-mysql.yaml" \
              -f "${K8S_DIR}/20-backend.yaml" \
              -f "${K8S_DIR}/30-frontend.yaml" \
              -f "${K8S_DIR}/40-network-policy.yaml" \
              -f "${K8S_DIR}/50-pdb.yaml" \
              -f "${K8S_DIR}/80-hpa.yaml"

            # ── 6. Wait for rollouts ──────────────────────────────────────────
            kubectl rollout status statefulset/mysql -n "$NAMESPACE" --timeout=180s
            kubectl rollout status deployment/backend  -n "$NAMESPACE" --timeout=120s &
            kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=60s  &
            wait

            kubectl get pods,svc,endpoints -n "$NAMESPACE" -o wide

            # ── 7. Smart smoke test with 3 self-heal attempts ─────────────────
            smoke_test() {
              local SERVICE=$1
              local URL=$2
              local MAX_HEAL=3

              for HEAL in $(seq 1 $MAX_HEAL); do
                echo "--- Smoke test attempt ${HEAL}/${MAX_HEAL} for ${SERVICE} ---"
                PASSED=false

                for POLL in $(seq 1 6); do
                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
                  if [ "$STATUS" = "200" ]; then
                    echo "${SERVICE} smoke test PASSED (heal=${HEAL}, poll=${POLL}) — HTTP $STATUS"
                    PASSED=true
                    break
                  fi
                  echo "Poll ${POLL}/6: HTTP $STATUS — waiting 5s..."
                  sleep 5
                done

                if [ "$PASSED" = "true" ]; then
                  return 0
                fi

                if [ "$HEAL" -lt "$MAX_HEAL" ]; then
                  echo "Self-heal attempt ${HEAL}: restarting ${SERVICE} deployment..."
                  kubectl rollout restart deployment/"${SERVICE}" -n "$NAMESPACE" 2>/dev/null || true
                  kubectl rollout status deployment/"${SERVICE}" -n "$NAMESPACE" --timeout=60s 2>/dev/null || true
                  sleep 5
                fi
              done

              echo "${SERVICE} SMOKE TEST FAILED after ${MAX_HEAL} self-heal attempts"
              echo "=== ${SERVICE} pod describe ==="
              kubectl describe pods -n "$NAMESPACE" -l "app=${SERVICE}" || true
              echo "=== ${SERVICE} logs ==="
              kubectl logs -n "$NAMESPACE" -l "app=${SERVICE}" --tail=50 || true
              return 1
            }

            # Test frontend via NodePort
            smoke_test "frontend" "http://localhost:8888"

            # Test backend via port-forward
            kubectl port-forward svc/backend 8080:8080 -n "$NAMESPACE" &
            PF_PID=$!
            sleep 3
            if ! smoke_test "backend" "http://localhost:8080/health"; then
              kill "$PF_PID" 2>/dev/null || true
              exit 1
            fi
            kill "$PF_PID" 2>/dev/null || true

            # ── 8. Apply observability manifests ─────────────────────────────
            if kubectl get namespace monitoring &>/dev/null; then
              echo "Applying ServiceMonitor..."
              kubectl apply -f "${K8S_DIR}/60-monitoring.yaml" || true
            else
              echo "Monitoring namespace not found — skipping ServiceMonitor"
              echo "Run: ansible-playbook -i hosts.ini install-observability.yml"
            fi

            # ── 9. Show HPA status ────────────────────────────────────────────
            echo "=== HPA status ==="
            kubectl get hpa -n "$NAMESPACE"

            echo "=== Deploy complete — ${IMAGE_TAG} ==="

      # ── Rollback + alert on failure ───────────────────────────────────────
      - name: Rollback deployments on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            NAMESPACE=skillpulse
            echo "Rolling back backend and frontend deployments..."
            kubectl rollout undo deployment/backend  -n "$NAMESPACE" 2>/dev/null || true
            kubectl rollout undo deployment/frontend -n "$NAMESPACE" 2>/dev/null || true
            kubectl rollout status deployment/backend  -n "$NAMESPACE" --timeout=60s 2>/dev/null || true
            kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=60s 2>/dev/null || true
            echo "Rollback complete"
            kubectl get pods -n "$NAMESPACE" -o wide

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Deploy failed after 3 self-heal attempts — ${context.sha.slice(0,7)}`,
              body: [
                '## Deployment Failure Report',
                '',
                `**Commit:** ${context.sha}`,
                `**Branch:** ${context.ref}`,
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Time:** ${new Date().toISOString()}`,
                '',
                '### What happened',
                'The deployment to the kind cluster failed after **3 self-heal attempts**.',
                'The previous stable version has been automatically rolled back.',
                '',
                '### Action required',
                '1. Check the workflow run logs linked above',
                '2. Review pod logs and events on the EC2 kind cluster',
                '3. Fix the issue and push a new commit',
                '',
                '> This issue was created automatically by the CD pipeline.',
              ].join('\n'),
              labels: ['deployment-failure', 'automated'],
            });

      - name: Send Slack alert on failure
        if: failure() && vars.SLACK_ENABLED == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚨 *SkillPulse deploy failed after 3 self-heal attempts*",
              "attachments": [
                {
                  "color": "#FF0000",
                  "fields": [
                    { "title": "Commit",   "value": "${{ github.event.workflow_run.head_sha }}", "short": true },
                    { "title": "Branch",   "value": "${{ github.ref_name }}",                    "short": true },
                    { "title": "Status",   "value": "Rolled back to previous version",           "short": false },
                    { "title": "Logs",     "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
