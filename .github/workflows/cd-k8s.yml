name: "CD - kind Cluster Deploy"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:

  # ── Job 1: Create kind cluster if not exists ──────────────────────────────
  cluster-setup:
    name: Ensure kind cluster exists
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix line endings and remove Zone.Identifier files
        run: |
          # Remove Windows Zone.Identifier metadata files (created when unzipping on Windows)
          find k8s/helm -name "*:Zone.Identifier" -delete 2>/dev/null || true
          # Normalize CRLF → LF on all Helm chart files
          find k8s/helm -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.tpl" \) \
            -exec sed -i 's/\r//' {} +
          echo "Line endings fixed."

      - name: Copy Helm chart to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "k8s/helm/"
          target:   "~/skillpulse"

      - name: Create kind cluster + install Helm if not present
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail

            CLUSTER=sp-cluster
            K8S_DIR=~/skillpulse/k8s

            # ── Install Helm if missing ──────────────────────────────────────
            if ! command -v helm &>/dev/null; then
              echo "Installing Helm..."
              curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            fi
            echo "Helm $(helm version --short)"

            # ── Create kind cluster if missing ───────────────────────────────
            if kind get clusters 2>/dev/null | grep -q "^${CLUSTER}$"; then
              echo "Cluster '${CLUSTER}' already exists — skipping creation"
            else
              echo "Creating kind cluster..."
              kind create cluster \
                --config "${K8S_DIR}/kind-config.yaml" \
                --name "$CLUSTER" \
                --wait 60s

              echo "Installing metrics-server..."
              kubectl apply --validate=false \
                -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

              kubectl patch deployment metrics-server \
                -n kube-system \
                --type=json \
                -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

              kubectl rollout status deployment/metrics-server \
                -n kube-system --timeout=60s
            fi

            kubectl get nodes
            echo "Cluster ready."

  # ── Job 2: Staging deploy ─────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging namespace
    needs: cluster-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix line endings and remove Zone.Identifier files
        run: |
          find k8s/helm -name "*:Zone.Identifier" -delete 2>/dev/null || true
          find k8s/helm -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.tpl" \) \
            -exec sed -i 's/\r//' {} +
          echo "Line endings fixed."

      - name: Copy Helm chart to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "k8s/helm/"
          target:   "~/skillpulse-staging"

      - name: Deploy to staging namespace via Helm
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG:           ${{ github.event.workflow_run.head_sha }}
          DOCKER_USER:         ${{ secrets.DOCKERHUB_USERNAME }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE:      ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER:          ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD:      ${{ secrets.MYSQL_PASSWORD }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     IMAGE_TAG,DOCKER_USER,MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD
          command_timeout: 15m
          script: |
            set -euo pipefail

            CLUSTER=sp-cluster
            NAMESPACE=skillpulse-staging
            CHART_DIR=~/skillpulse-staging/k8s/helm/skillpulse
            IMAGE_TAG="${IMAGE_TAG::7}"

            echo "=== Staging deploy: ${IMAGE_TAG} ==="

            # ── Pull and load images into kind nodes ─────────────────────────
            echo "Pulling images..."
            docker pull "${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}" &
            docker pull "${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}" &
            wait

            echo "Loading images into kind..."
            kind load docker-image "${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}"  --name "$CLUSTER" &
            kind load docker-image "${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}" --name "$CLUSTER" &
            wait

            # ── Inject DB secret (idempotent) ────────────────────────────────
            # Helm does not manage secrets so they are never committed to the chart.
            # --dry-run=client | kubectl apply makes this safe to re-run.
            kubectl create namespace "$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl create secret generic skillpulse-db \
              --namespace="$NAMESPACE" \
              --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
              --from-literal=MYSQL_DATABASE="$MYSQL_DATABASE" \
              --from-literal=MYSQL_USER="$MYSQL_USER" \
              --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              --save-config \
              --dry-run=client -o yaml | kubectl apply -f -

            # ── Helm upgrade (idempotent install-or-upgrade) ─────────────────
            # -f values-staging.yaml  → namespace=skillpulse-staging,
            #                           nodePort=30081, replicas=1, etc.
            # --set image.tag         → pins the exact 7-char SHA
            # --set image.dockerUser  → injects DockerHub username from secrets
            # --atomic                → rolls back automatically on failure
            # --timeout               → matches legacy command_timeout

            # ── Adopt pre-existing resources into Helm ownership ────────────────
            # Resources created by the old raw kubectl apply have no Helm labels.
            # Helm refuses to manage any resource it doesn't own.
            # This loop labels and annotates every resource type in the chart
            # so Helm can adopt them. Safe to re-run — kubectl annotate/label
            # with --overwrite is idempotent. Once Helm owns the resources,
            # this block is a no-op on every subsequent deploy.
            echo "Adopting existing resources into Helm ownership..."
            RELEASE=skillpulse

            # Adopt the namespace itself (cluster-scoped — no -n flag)
            kubectl annotate namespace "$NAMESPACE" \
              "meta.helm.sh/release-name=${RELEASE}" \
              "meta.helm.sh/release-namespace=${NAMESPACE}" \
              --overwrite 2>/dev/null || true
            kubectl label namespace "$NAMESPACE" \
              "app.kubernetes.io/managed-by=Helm" \
              --overwrite 2>/dev/null || true

            # Adopt all namespaced resources
            for RESOURCE_TYPE in configmap service statefulset deployment networkpolicy poddisruptionbudget horizontalpodautoscaler; do
              kubectl get "$RESOURCE_TYPE" -n "$NAMESPACE" -o name 2>/dev/null | while read RESOURCE; do
                kubectl annotate "$RESOURCE" -n "$NAMESPACE" \
                  "meta.helm.sh/release-name=${RELEASE}" \
                  "meta.helm.sh/release-namespace=${NAMESPACE}" \
                  --overwrite 2>/dev/null || true
                kubectl label "$RESOURCE" -n "$NAMESPACE" \
                  "app.kubernetes.io/managed-by=Helm" \
                  --overwrite 2>/dev/null || true
              done
            done
            echo "Resource adoption complete."

            helm upgrade --install skillpulse "$CHART_DIR" \
              --namespace "$NAMESPACE" \
              -f "${CHART_DIR}/values-staging.yaml" \
              --set image.tag="${IMAGE_TAG}" \
              --set image.dockerUser="${DOCKER_USER}" \
              --atomic \
              --timeout 10m \
              --wait

            # ── Rollout status ───────────────────────────────────────────────
            kubectl rollout status statefulset/mysql  -n "$NAMESPACE" --timeout=300s
            kubectl rollout status deployment/backend  -n "$NAMESPACE" --timeout=300s
            kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=180s

            # ── Smoke tests (staging: docker exec → direct CNI pod access) ───
            # The kind control-plane container can reach all pod IPs directly.
            # curl is available in kindest/node images; || true prevents leaking.

            echo "Running backend smoke test..."
            BACKEND_PASSED=false
            for i in $(seq 1 6); do
              BACKEND_IP=$(kubectl get pod -n "$NAMESPACE" -l app=backend \
                -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || echo "")
              echo "Attempt $i: backend pod IP = $BACKEND_IP"
              if [ -z "$BACKEND_IP" ]; then
                echo "No pod IP yet — retrying in 5s..."
                sleep 5
                continue
              fi
              STATUS=$(docker exec sp-cluster-control-plane \
                curl -s -o /dev/null -w "%{http_code}" --max-time 5 \
                "http://${BACKEND_IP}:8080/health" || true)
              echo "Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "STAGING backend smoke test PASSED"
                BACKEND_PASSED=true
                break
              fi
              sleep 5
            done
            if [ "$BACKEND_PASSED" != "true" ]; then
              echo "STAGING backend smoke test FAILED"
              kubectl get pods -n "$NAMESPACE" -o wide
              kubectl logs -n "$NAMESPACE" -l app=backend --tail=50 || true
              exit 1
            fi

            echo "Running frontend smoke test..."
            FRONTEND_PASSED=false
            for i in $(seq 1 6); do
              FRONTEND_IP=$(kubectl get pod -n "$NAMESPACE" -l app=frontend \
                -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || echo "")
              echo "Attempt $i: frontend pod IP = $FRONTEND_IP"
              if [ -z "$FRONTEND_IP" ]; then
                echo "No pod IP yet — retrying in 5s..."
                sleep 5
                continue
              fi
              FRONT_STATUS=$(docker exec sp-cluster-control-plane \
                curl -s -o /dev/null -w "%{http_code}" --max-time 5 \
                "http://${FRONTEND_IP}:8080" || true)
              echo "Attempt $i: HTTP $FRONT_STATUS"
              if [ "$FRONT_STATUS" = "200" ]; then
                echo "STAGING frontend smoke test PASSED"
                FRONTEND_PASSED=true
                break
              fi
              sleep 5
            done
            if [ "$FRONTEND_PASSED" != "true" ]; then
              echo "STAGING frontend smoke test FAILED"
              kubectl get pods -n "$NAMESPACE" -o wide
              exit 1
            fi

            echo "=== Staging smoke tests PASSED ==="
            echo "=== Staging deploy complete: ${IMAGE_TAG} ==="

  # ── Job 3: Production deploy ──────────────────────────────────────────────
  kind-deploy:
    name: Deploy to production (kind cluster on EC2)
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix line endings and remove Zone.Identifier files
        run: |
          find k8s/helm -name "*:Zone.Identifier" -delete 2>/dev/null || true
          find k8s/helm -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.tpl" \) \
            -exec sed -i 's/\r//' {} +
          echo "Line endings fixed."

      - name: Copy Helm chart to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "k8s/helm/"
          target:   "~/skillpulse"

      - name: Deploy to production namespace via Helm
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG:           ${{ github.event.workflow_run.head_sha }}
          DOCKER_USER:         ${{ secrets.DOCKERHUB_USERNAME }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE:      ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER:          ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD:      ${{ secrets.MYSQL_PASSWORD }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     IMAGE_TAG,DOCKER_USER,MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD
          command_timeout: 25m
          script: |
            set -euo pipefail

            CLUSTER=sp-cluster
            NAMESPACE=skillpulse
            CHART_DIR=~/skillpulse/k8s/helm/skillpulse
            IMAGE_TAG="${IMAGE_TAG::7}"

            echo "=== Production deploy: ${IMAGE_TAG} ==="

            kubectl get nodes

            # ── Pull and load images ─────────────────────────────────────────
            echo "Pulling images..."
            docker pull "${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}" &
            docker pull "${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}" &
            wait

            echo "Loading images into kind..."
            kind load docker-image "${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}"  --name "$CLUSTER" &
            kind load docker-image "${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}" --name "$CLUSTER" &
            wait

            # ── Inject DB secret (idempotent) ────────────────────────────────
            kubectl create namespace "$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl create secret generic skillpulse-db \
              --namespace="$NAMESPACE" \
              --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
              --from-literal=MYSQL_DATABASE="$MYSQL_DATABASE" \
              --from-literal=MYSQL_USER="$MYSQL_USER" \
              --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              --save-config \
              --dry-run=client -o yaml | kubectl apply -f -

            # ── Helm upgrade (production defaults from values.yaml) ───────────
            # values.yaml sets: namespace=skillpulse, nodePort=30080,
            #                   backend.replicas=2, frontend.replicas=2,
            #                   networkPolicy.enabled=true, pdb.enabled=true

            # ── Adopt pre-existing resources into Helm ownership ────────────────
            # Resources created by the old raw kubectl apply have no Helm labels.
            # Helm refuses to manage any resource it doesn't own.
            # This loop labels and annotates every resource type in the chart
            # so Helm can adopt them. Safe to re-run — kubectl annotate/label
            # with --overwrite is idempotent. Once Helm owns the resources,
            # this block is a no-op on every subsequent deploy.
            echo "Adopting existing resources into Helm ownership..."
            RELEASE=skillpulse

            # Adopt the namespace itself (cluster-scoped — no -n flag)
            kubectl annotate namespace "$NAMESPACE" \
              "meta.helm.sh/release-name=${RELEASE}" \
              "meta.helm.sh/release-namespace=${NAMESPACE}" \
              --overwrite 2>/dev/null || true
            kubectl label namespace "$NAMESPACE" \
              "app.kubernetes.io/managed-by=Helm" \
              --overwrite 2>/dev/null || true

            # Adopt all namespaced resources
            for RESOURCE_TYPE in configmap service statefulset deployment networkpolicy poddisruptionbudget horizontalpodautoscaler; do
              kubectl get "$RESOURCE_TYPE" -n "$NAMESPACE" -o name 2>/dev/null | while read RESOURCE; do
                kubectl annotate "$RESOURCE" -n "$NAMESPACE" \
                  "meta.helm.sh/release-name=${RELEASE}" \
                  "meta.helm.sh/release-namespace=${NAMESPACE}" \
                  --overwrite 2>/dev/null || true
                kubectl label "$RESOURCE" -n "$NAMESPACE" \
                  "app.kubernetes.io/managed-by=Helm" \
                  --overwrite 2>/dev/null || true
              done
            done
            echo "Resource adoption complete."

            helm upgrade --install skillpulse "$CHART_DIR" \
              --namespace "$NAMESPACE" \
              -f "${CHART_DIR}/values.yaml" \
              --set image.tag="${IMAGE_TAG}" \
              --set image.dockerUser="${DOCKER_USER}" \
              --atomic \
              --timeout 20m \
              --wait

            # ── Rollout status ───────────────────────────────────────────────
            kubectl rollout status statefulset/mysql -n "$NAMESPACE" --timeout=300s

            kubectl rollout status deployment/backend  -n "$NAMESPACE" --timeout=300s &
            kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=180s &
            wait

            kubectl get pods,svc,endpoints -n "$NAMESPACE" -o wide

            # ── Smoke tests (production: port-forward) ───────────────────────
            smoke_test() {
              local SERVICE=$1
              local URL=$2
              local MAX_HEAL=3

              for HEAL in $(seq 1 $MAX_HEAL); do
                echo "--- Smoke test attempt ${HEAL}/${MAX_HEAL} for ${SERVICE} ---"
                PASSED=false

                for POLL in $(seq 1 6); do
                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
                  if [ "$STATUS" = "200" ]; then
                    echo "${SERVICE} smoke test PASSED — HTTP $STATUS"
                    PASSED=true
                    break
                  fi
                  echo "Poll ${POLL}/6: HTTP $STATUS — waiting 5s..."
                  sleep 5
                done

                if [ "$PASSED" = "true" ]; then
                  return 0
                fi

                if [ "$HEAL" -lt "$MAX_HEAL" ]; then
                  echo "Restarting ${SERVICE}..."
                  kubectl rollout restart deployment/"${SERVICE}" -n "$NAMESPACE" || true
                  kubectl rollout status deployment/"${SERVICE}" -n "$NAMESPACE" --timeout=120s || true
                  sleep 5
                fi
              done

              kubectl describe pods -n "$NAMESPACE" -l "app=${SERVICE}" || true
              kubectl logs -n "$NAMESPACE" -l "app=${SERVICE}" --tail=50 || true
              return 1
            }

            kubectl port-forward svc/frontend 8888:8080 -n "$NAMESPACE" &
            PF_FRONT_PID=$!
            sleep 5
            if ! smoke_test "frontend" "http://localhost:8888"; then
              kill "$PF_FRONT_PID" 2>/dev/null || true
              exit 1
            fi
            kill "$PF_FRONT_PID" 2>/dev/null || true

            kubectl port-forward svc/backend 8080:8080 -n "$NAMESPACE" &
            PF_BACK_PID=$!
            sleep 5
            if ! smoke_test "backend" "http://localhost:8080/health"; then
              kill "$PF_BACK_PID" 2>/dev/null || true
              exit 1
            fi
            kill "$PF_BACK_PID" 2>/dev/null || true

            # ── Optional: apply monitoring if prometheus-operator is present ─
            if kubectl api-resources | grep -q servicemonitors; then
              helm upgrade --install skillpulse "$CHART_DIR" \
                --namespace "$NAMESPACE" \
                -f "${CHART_DIR}/values.yaml" \
                --set image.tag="${IMAGE_TAG}" \
                --set image.dockerUser="${DOCKER_USER}" \
                --set monitoring.enabled=true \
                --reuse-values \
                --atomic \
                --timeout 5m \
                --wait || true
            fi

            echo "=== HPA status ==="
            kubectl get hpa -n "$NAMESPACE"

            echo "=== Production deploy complete — ${IMAGE_TAG} ==="

      # ── Rollback on failure ────────────────────────────────────────────────
      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            NAMESPACE=skillpulse
            echo "Rolling back Helm release..."
            # helm rollback is atomic: reverts ALL resources to the last good revision
            helm rollback skillpulse --namespace "$NAMESPACE" --wait --timeout 3m || true
            echo "Rollback complete"
            kubectl get pods -n "$NAMESPACE" -o wide

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Production deploy failed — ${context.sha.slice(0,7)}`,
              body: [
                '## Deployment Failure Report',
                '',
                `**Commit:** ${context.sha}`,
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Time:** ${new Date().toISOString()}`,
                '',
                '### What happened',
                'Production deployment failed after 3 self-heal attempts. Previous Helm revision has been rolled back.',
                '',
                '### Action required',
                '1. Check the workflow run logs above',
                '2. Fix the issue and push a new commit',
                '',
                '> Auto-created by CD pipeline.',
              ].join('\n'),
              labels: ['deployment-failure', 'automated'],
            });

      - name: Send Slack alert on failure
        if: failure() && vars.SLACK_ENABLED == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚨 *SkillPulse production deploy failed*",
              "attachments": [{
                "color": "#FF0000",
                "fields": [
                  { "title": "Commit", "value": "${{ github.event.workflow_run.head_sha }}", "short": true },
                  { "title": "Status", "value": "Rolled back to previous Helm revision", "short": true },
                  { "title": "Logs",   "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
