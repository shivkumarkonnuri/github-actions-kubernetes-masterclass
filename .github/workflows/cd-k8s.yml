name: "CD - kind Cluster Deploy"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:

  # ── Job 1: Create kind cluster if not exists ──────────────────────────────
  # Runs first — staging and production both depend on this
  cluster-setup:
    name: Ensure kind cluster exists
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy k8s manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "k8s/"
          target:   "~/skillpulse"

      - name: Create kind cluster if not exists
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail

            CLUSTER=sp-cluster
            K8S_DIR=~/skillpulse/k8s

            if kind get clusters 2>/dev/null | grep -q "^${CLUSTER}$"; then
              echo "Cluster '${CLUSTER}' already exists — skipping creation"
            else
              echo "Creating kind cluster..."
              kind create cluster \
                --config "${K8S_DIR}/kind-config.yaml" \
                --name "$CLUSTER" \
                --wait 60s

              echo "Installing metrics-server..."
              kubectl apply --validate=false \
                -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

              kubectl patch deployment metrics-server \
                -n kube-system \
                --type=json \
                -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

              kubectl rollout status deployment/metrics-server \
                -n kube-system --timeout=60s
            fi

            kubectl get nodes
            echo "Cluster ready."

  # ── Job 2: Staging deploy ─────────────────────────────────────────────────
  # Runs after cluster exists — deploys to skillpulse-staging namespace
  deploy-staging:
    name: Deploy to staging namespace
    needs: cluster-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy k8s manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "k8s/"
          target:   "~/skillpulse-staging"

      - name: Deploy to staging namespace
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG:           ${{ github.event.workflow_run.head_sha }}
          DOCKER_USER:         ${{ secrets.DOCKERHUB_USERNAME }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE:      ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER:          ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD:      ${{ secrets.MYSQL_PASSWORD }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     IMAGE_TAG,DOCKER_USER,MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD
          command_timeout: 15m
          script: |
            set -euo pipefail

            CLUSTER=sp-cluster
            NAMESPACE=skillpulse-staging
            K8S_DIR=~/skillpulse-staging/k8s
            IMAGE_TAG="${IMAGE_TAG::7}"

            echo "=== Staging deploy: ${IMAGE_TAG} ==="

            # Pull and load images into kind nodes
            echo "Pulling images..."
            docker pull "${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}" &
            docker pull "${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}" &
            wait

            echo "Loading images into kind..."
            kind load docker-image "${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}"  --name "$CLUSTER" &
            kind load docker-image "${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}" --name "$CLUSTER" &
            wait

            # Create namespace
            kubectl create namespace "$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -

            # Inject DB secret
            kubectl create secret generic skillpulse-db \
              --namespace="$NAMESPACE" \
              --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
              --from-literal=MYSQL_DATABASE="$MYSQL_DATABASE" \
              --from-literal=MYSQL_USER="$MYSQL_USER" \
              --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              --save-config \
              --dry-run=client -o yaml | kubectl apply -f -

            # Pin image tags
            sed -i \
              "s|image: .*/skillpulse-backend:.*|image: ${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}|" \
              "${K8S_DIR}/20-backend.yaml"
            sed -i \
              "s|image: .*/skillpulse-frontend:.*|image: ${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}|" \
              "${K8S_DIR}/30-frontend.yaml"

            # Apply manifests
            kubectl apply --validate=false \
              -f "${K8S_DIR}/10-mysql.yaml" \
              -f "${K8S_DIR}/20-backend.yaml" \
              -f "${K8S_DIR}/30-frontend.yaml" \
              -n "$NAMESPACE"

            echo "Waiting for pods..."
            sleep 20

            kubectl rollout status statefulset/mysql  -n "$NAMESPACE" --timeout=300s
            kubectl rollout status deployment/backend  -n "$NAMESPACE" --timeout=300s
            kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=180s

            # Smoke tests using docker exec on kind control-plane container
            # control-plane has direct CNI access to all pod IPs across all nodes
            # Pod IP is fetched fresh inside each retry loop to handle new deployments

            # Smoke tests using curl via docker exec on kind control-plane container
            # control-plane has direct CNI access to all pod IPs across all nodes
            # curl is available in kindest/node images, || true prevents exit code leaking

            # Backend smoke test
            echo "Running backend smoke test..."
            BACKEND_PASSED=false
            for i in $(seq 1 6); do
              BACKEND_IP=$(kubectl get pod -n "$NAMESPACE" -l app=backend                 -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || echo "")
              echo "Attempt $i: backend pod IP = $BACKEND_IP"
              if [ -z "$BACKEND_IP" ]; then
                echo "No pod IP yet — retrying in 5s..."
                sleep 5
                continue
              fi
              STATUS=$(docker exec sp-cluster-control-plane                 curl -s -o /dev/null -w "%{http_code}" --max-time 5                 "http://${BACKEND_IP}:8080/health" || true)
              echo "Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "STAGING backend smoke test PASSED"
                BACKEND_PASSED=true
                break
              fi
              sleep 5
            done
            if [ "$BACKEND_PASSED" != "true" ]; then
              echo "STAGING backend smoke test FAILED"
              kubectl get pods -n "$NAMESPACE" -o wide
              kubectl logs -n "$NAMESPACE" -l app=backend --tail=50 || true
              exit 1
            fi

            # Frontend smoke test
            echo "Running frontend smoke test..."
            FRONTEND_PASSED=false
            for i in $(seq 1 6); do
              FRONTEND_IP=$(kubectl get pod -n "$NAMESPACE" -l app=frontend                 -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || echo "")
              echo "Attempt $i: frontend pod IP = $FRONTEND_IP"
              if [ -z "$FRONTEND_IP" ]; then
                echo "No pod IP yet — retrying in 5s..."
                sleep 5
                continue
              fi
              FRONT_STATUS=$(docker exec sp-cluster-control-plane                 curl -s -o /dev/null -w "%{http_code}" --max-time 5                 "http://${FRONTEND_IP}:80" || true)
              echo "Attempt $i: HTTP $FRONT_STATUS"
              if [ "$FRONT_STATUS" = "200" ]; then
                echo "STAGING frontend smoke test PASSED"
                FRONTEND_PASSED=true
                break
              fi
              sleep 5
            done
            if [ "$FRONTEND_PASSED" != "true" ]; then
              echo "STAGING frontend smoke test FAILED"
              kubectl get pods -n "$NAMESPACE" -o wide
              exit 1
            fi

            echo "=== Staging smoke tests PASSED ==="
            echo "=== Staging deploy complete: ${IMAGE_TAG} ==="

  # ── Job 3: Production deploy ──────────────────────────────────────────────
  # Runs only after staging passes
  kind-deploy:
    name: Deploy to production (kind cluster on EC2)
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy k8s manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "k8s/"
          target:   "~/skillpulse"

      - name: Deploy to kind cluster
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG:           ${{ github.event.workflow_run.head_sha }}
          DOCKER_USER:         ${{ secrets.DOCKERHUB_USERNAME }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE:      ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER:          ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD:      ${{ secrets.MYSQL_PASSWORD }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     IMAGE_TAG,DOCKER_USER,MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD
          command_timeout: 25m
          script: |
            set -euo pipefail

            CLUSTER=sp-cluster
            NAMESPACE=skillpulse
            K8S_DIR=~/skillpulse/k8s
            IMAGE_TAG="${IMAGE_TAG::7}"

            echo "=== Production deploy: ${IMAGE_TAG} ==="

            kubectl get nodes

            echo "Pulling images..."
            docker pull "${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}" &
            docker pull "${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}" &
            wait

            echo "Loading images into kind..."
            kind load docker-image "${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}"  --name "$CLUSTER" &
            kind load docker-image "${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}" --name "$CLUSTER" &
            wait

            sed -i \
              "s|image: .*/skillpulse-backend:.*|image: ${DOCKER_USER}/skillpulse-backend:${IMAGE_TAG}|" \
              "${K8S_DIR}/20-backend.yaml"
            sed -i \
              "s|image: .*/skillpulse-frontend:.*|image: ${DOCKER_USER}/skillpulse-frontend:${IMAGE_TAG}|" \
              "${K8S_DIR}/30-frontend.yaml"

            kubectl apply --validate=false -f "${K8S_DIR}/00-namespace.yaml"

            kubectl create secret generic skillpulse-db \
              --namespace="$NAMESPACE" \
              --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
              --from-literal=MYSQL_DATABASE="$MYSQL_DATABASE" \
              --from-literal=MYSQL_USER="$MYSQL_USER" \
              --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              --save-config \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply --validate=false \
              -f "${K8S_DIR}/10-mysql.yaml" \
              -f "${K8S_DIR}/20-backend.yaml" \
              -f "${K8S_DIR}/30-frontend.yaml" \
              -f "${K8S_DIR}/40-network-policy.yaml" \
              -f "${K8S_DIR}/50-pdb.yaml" \
              -f "${K8S_DIR}/80-hpa.yaml"

            echo "Waiting for pods..."
            sleep 20

            kubectl rollout status statefulset/mysql -n "$NAMESPACE" --timeout=300s

            kubectl rollout status deployment/backend  -n "$NAMESPACE" --timeout=300s &
            kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=180s &
            wait

            kubectl get pods,svc,endpoints -n "$NAMESPACE" -o wide

            smoke_test() {
              local SERVICE=$1
              local URL=$2
              local MAX_HEAL=3

              for HEAL in $(seq 1 $MAX_HEAL); do
                echo "--- Smoke test attempt ${HEAL}/${MAX_HEAL} for ${SERVICE} ---"
                PASSED=false

                for POLL in $(seq 1 6); do
                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
                  if [ "$STATUS" = "200" ]; then
                    echo "${SERVICE} smoke test PASSED — HTTP $STATUS"
                    PASSED=true
                    break
                  fi
                  echo "Poll ${POLL}/6: HTTP $STATUS — waiting 5s..."
                  sleep 5
                done

                if [ "$PASSED" = "true" ]; then
                  return 0
                fi

                if [ "$HEAL" -lt "$MAX_HEAL" ]; then
                  echo "Restarting ${SERVICE}..."
                  kubectl rollout restart deployment/"${SERVICE}" -n "$NAMESPACE" || true
                  kubectl rollout status deployment/"${SERVICE}" -n "$NAMESPACE" --timeout=120s || true
                  sleep 5
                fi
              done

              kubectl describe pods -n "$NAMESPACE" -l "app=${SERVICE}" || true
              kubectl logs -n "$NAMESPACE" -l "app=${SERVICE}" --tail=50 || true
              return 1
            }

            # Frontend smoke test
            kubectl port-forward svc/frontend 8888:8080 -n "$NAMESPACE" &
            PF_FRONT_PID=$!
            sleep 5
            if ! smoke_test "frontend" "http://localhost:8888"; then
              kill "$PF_FRONT_PID" 2>/dev/null || true
              exit 1
            fi
            kill "$PF_FRONT_PID" 2>/dev/null || true

            # Backend smoke test
            kubectl port-forward svc/backend 8080:8080 -n "$NAMESPACE" &
            PF_BACK_PID=$!
            sleep 5
            if ! smoke_test "backend" "http://localhost:8080/health"; then
              kill "$PF_BACK_PID" 2>/dev/null || true
              exit 1
            fi
            kill "$PF_BACK_PID" 2>/dev/null || true

            if kubectl get namespace monitoring &>/dev/null; then
              kubectl apply --validate=false -f "${K8S_DIR}/60-monitoring.yaml" || true
            fi

            echo "=== HPA status ==="
            kubectl get hpa -n "$NAMESPACE"

            echo "=== Production deploy complete — ${IMAGE_TAG} ==="

      # ── Rollback on failure ────────────────────────────────────────────────
      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            NAMESPACE=skillpulse
            echo "Rolling back..."
            kubectl rollout undo deployment/backend  -n "$NAMESPACE" || true
            kubectl rollout undo deployment/frontend -n "$NAMESPACE" || true
            kubectl rollout status deployment/backend  -n "$NAMESPACE" --timeout=60s || true
            kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=60s || true
            echo "Rollback complete"
            kubectl get pods -n "$NAMESPACE" -o wide

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Production deploy failed — ${context.sha.slice(0,7)}`,
              body: [
                '## Deployment Failure Report',
                '',
                `**Commit:** ${context.sha}`,
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Time:** ${new Date().toISOString()}`,
                '',
                '### What happened',
                'Production deployment failed after 3 self-heal attempts. Previous version has been rolled back.',
                '',
                '### Action required',
                '1. Check the workflow run logs above',
                '2. Fix the issue and push a new commit',
                '',
                '> Auto-created by CD pipeline.',
              ].join('\n'),
              labels: ['deployment-failure', 'automated'],
            });

      - name: Send Slack alert on failure
        if: failure() && vars.SLACK_ENABLED == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚨 *SkillPulse production deploy failed*",
              "attachments": [{
                "color": "#FF0000",
                "fields": [
                  { "title": "Commit", "value": "${{ github.event.workflow_run.head_sha }}", "short": true },
                  { "title": "Status", "value": "Rolled back to previous version", "short": true },
                  { "title": "Logs",   "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
