name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read
  security-events: write

jobs:

  # ── Shared Go module cache ──────────────────────────────────────────────────
  # Warms the GHA Go cache once so code-quality and dependency-scan
  # both restore from it instead of each downloading modules independently.
  go-cache:
    name: Warm Go module cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Go (warm cache)
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download modules
        working-directory: backend
        run: go mod download

  # ── Static analysis / scan jobs (all run in parallel) ──────────────────────
  code-quality:
    needs: [go-cache]
    uses: ./.github/workflows/code-quality.yml

  secrets-scan:
    uses: ./.github/workflows/secrets-scan.yml

  dependency-scan:
    needs: [go-cache]
    uses: ./.github/workflows/dependency-scan.yml
    secrets: inherit

  docker-lint:
    uses: ./.github/workflows/docker-lint.yml

  # ── Build — backend and frontend run in parallel ────────────────────────────
  docker-build-push:
    needs: [code-quality, secrets-scan, dependency-scan, docker-lint]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit

  # ── Scan — backend and frontend run in parallel ─────────────────────────────
  docker-image-scan:
    needs: [docker-build-push]
    uses: ./.github/workflows/docker-image-scan.yml
    secrets: inherit
    with:
      image_tag: ${{ github.sha }}
