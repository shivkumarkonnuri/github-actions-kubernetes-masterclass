name: "Terraform Scan"

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  tfsec:
    name: Terraform security scan (tfsec)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: tfsec — scan terraform directory
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          # soft_fail: false means pipeline fails on any HIGH/CRITICAL finding
          # Set to true if you want warnings only while fixing issues
          soft_fail: false
          github_token: ${{ github.token }}

      - name: tfsec — SARIF upload to GitHub Security tab
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        if: always()
        with:
          working_directory: terraform
          sarif_file: tfsec.sarif

      - name: Upload tfsec SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec.sarif
          category: tfsec
