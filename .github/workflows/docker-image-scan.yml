name: "Docker Image Scan"

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true

permissions:
  contents: read
  security-events: write

jobs:
  # ── Backend scan ───────────────────────────────────────────────────────────
  trivy-scan-backend:
    name: Image vulnerability scan — Backend (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull backend image from DockerHub
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:${{ inputs.image_tag }}

      - name: Tag image for scanning
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:${{ inputs.image_tag }} skillpulse-backend:scan

      - name: Trivy — backend (table, fails on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: skillpulse-backend:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy — backend (SARIF to GitHub Security tab)
        uses: aquasecurity/trivy-action@v0.35.0
        if: always()
        with:
          image-ref: skillpulse-backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload backend SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  # ── Frontend scan ──────────────────────────────────────────────────────────
  trivy-scan-frontend:
    name: Image vulnerability scan — Frontend (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull frontend image from DockerHub
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:${{ inputs.image_tag }}

      - name: Tag image for scanning
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:${{ inputs.image_tag }} skillpulse-frontend:scan

      - name: Trivy — frontend (table, fails on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: skillpulse-frontend:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy — frontend (SARIF to GitHub Security tab)
        uses: aquasecurity/trivy-action@v0.35.0
        if: always()
        with:
          image-ref: skillpulse-frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload frontend SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
