name: "Docker Image Scan"

on:
  workflow_call:

permissions:
  content: read
  security-events: write

jobs:
  trivy-scan:
    name: Image vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      # Re-load images from GHA cache — no second DockerHub pull needed
      - name: Load backend image from cache
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: skillpulse-backend:scan
          cache-from: type=gha,scope=backend
 
      - name: Load frontend image from cache
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: skillpulse-frontend:scan
          cache-from: type=gha,scope=frontend
 
      # ── Backend scan ──────────────────────────────────────────────────────
      - name: Trivy — backend (table, fails on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: skillpulse-backend:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
 
      - name: Trivy — backend (SARIF → GitHub Security tab)
        uses: aquasecurity/trivy-action@0.30.0
        # always() ensures report is uploaded even if the table scan fails
        if: always()
        with:
          image-ref: skillpulse-backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
 
      - name: Upload backend SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
 
      # ── Frontend scan ─────────────────────────────────────────────────────
      - name: Trivy — frontend (table, fails on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: skillpulse-frontend:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
 
      - name: Trivy — frontend (SARIF → GitHub Security tab)
        uses: aquasecurity/trivy-action@0.30.0
        if: always()
        with:
          image-ref: skillpulse-frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
 
      - name: Upload frontend SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
