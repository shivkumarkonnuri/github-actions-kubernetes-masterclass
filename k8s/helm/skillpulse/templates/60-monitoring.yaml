{{- if .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
    release: prometheus
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backend-alerts
  namespace: {{ .Values.namespace }}
  labels:
    release: prometheus
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: skillpulse.backend
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(gin_requests_total{namespace="{{ .Values.namespace }}",status=~"5.."}[5m]))
            /
            sum(rate(gin_requests_total{namespace="{{ .Values.namespace }}"}[5m])) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High error rate on SkillPulse backend"
            description: "Error rate is {{ "{{" }} $value | humanizePercentage {{ "}}" }} over last 5 minutes"

        - alert: HighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(gin_request_duration_seconds_bucket{namespace="{{ .Values.namespace }}"}[5m]))
              by (le)
            ) > 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High p99 latency on SkillPulse backend"
            description: "p99 latency is {{ "{{" }} $value {{ "}}" }}s"
{{- end }}
