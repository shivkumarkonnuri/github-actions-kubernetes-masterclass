---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: skillpulse
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: skillpulse
spec:
  replicas: 2          # minimum 2 so HPA starts from a HA baseline
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # zero-downtime: always keep full capacity during rollout
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Prometheus scrape annotations (fallback if ServiceMonitor is not installed)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Pod-level: no service account token auto-mounted
      automountServiceAccountToken: false
      # Graceful shutdown: give the app 35s to drain (matches server timeout of 30s + buffer)
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: trainwithshubham/skillpulse-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: PORT
              value: "8080"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: skillpulse-db
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillpulse-db
                  key: MYSQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: skillpulse-db
                  key: MYSQL_DATABASE
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]

          # ── startupProbe ──────────────────────────────────────────────────
          # Gives the app up to 60s (30 × 2s) to start before liveness kicks in.
          # Prevents liveness from killing the pod while MySQL is still booting.
          # Once startupProbe passes, liveness and readiness take over.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30   # 30 attempts × 2s = 60s maximum startup time
            periodSeconds: 2

          # ── livenessProbe ─────────────────────────────────────────────────
          # Only active AFTER startupProbe passes.
          # Restarts the pod if the app hangs or deadlocks.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0   # startupProbe handles the delay
            periodSeconds: 10
            failureThreshold: 3

          # ── readinessProbe ────────────────────────────────────────────────
          # Removes pod from Service endpoints if it can't serve traffic.
          # Conservative: 5s period means traffic is re-routed quickly.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3
